[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-security-audit"
version = "0.1.0"
description = "Policy-driven security auditing framework for AI agent events"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0,<3.0", "PyYAML>=6.0"]

[project.scripts]
agent-security-audit = "agent_security_audit.cli:main"

[tool.setuptools.packages.find]
include = ["agent_security_audit*"]
